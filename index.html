<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridge-building's Draw</title>
<style>
  :root { --navy:#12263a; --orange:#c0362c; --bg:#f7f3ec; --text:#2b333b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Calibri, Arial, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--navy); color:#fff; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:20px; font-family:Georgia, serif; }
  main { max-width:560px; margin:32px auto; padding:0 16px; }
  .card { background:#fff; border:1px solid #e3dccf; border-radius:10px; padding:24px; margin-bottom:20px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button { flex:1; padding:10px; border:1px solid #e3dccf; background:#f7f3ec; cursor:pointer; border-radius:6px; font-size:15px; }
  .tabs button.active { background:var(--navy); color:#fff; border-color:var(--navy); }
  label { display:block; margin:12px 0 4px; font-size:14px; }
  input { width:100%; padding:10px; border:1px solid #cfc7b8; border-radius:6px; font-size:16px; }
  #submit, #logout { margin-top:16px; padding:12px; width:100%; background:var(--orange); color:#fff; border:0; border-radius:6px; font-size:16px; cursor:pointer; }
  #submit:disabled { opacity:.6; cursor:wait; }
  #logout { width:auto; margin:0; padding:8px 14px; background:transparent; border:1px solid #fff; display:none; }
  #msg { margin-top:12px; font-size:14px; min-height:18px; }
  #msg.err { color:#b00020; } #msg.ok { color:#1b7a3d; }
  .balance { font-size:32px; font-weight:bold; color:var(--orange); font-family:Georgia, serif; }
  .draw { border-top:1px solid #eee; padding:12px 0; }
  .draw:first-child { border-top:0; }
  .muted { color:#6b7480; font-size:14px; }
  .err { color:#b00020; } .ok { color:#1b7a3d; }
  .buy { margin-top:8px; padding:8px 16px; background:var(--orange); color:#fff; border:0; border-radius:6px; font-size:15px; cursor:pointer; }
  .buy:disabled { opacity:.6; cursor:wait; }
  .rej { background:#6b7480; margin-left:8px; }
  .terms h3 { margin:16px 0 4px; font-family:Georgia, serif; font-size:16px; }
  .terms p { margin:0; line-height:1.5; font-size:15px; }
  a { color:var(--orange); }
  .gal-main { width:100%; max-height:280px; object-fit:cover; border-radius:8px; margin-top:8px; display:block; }
  .gal-row { display:flex; gap:6px; margin-top:6px; overflow-x:auto; }
  .gal-thumb { width:64px; height:48px; object-fit:cover; border-radius:6px; cursor:pointer; border:1px solid #e3dccf; }
  select { width:100%; padding:10px; border:1px solid #cfc7b8; border-radius:6px; font-size:16px; background:#fff; }
</style>
</head>
<body>
<header>
  <h1>Bridge-building's Draw</h1>
  <button id="logout">Log out</button>
</header>

<main>
  <!-- Sign up / Log in -->
  <section id="auth" class="card">
    <div class="tabs">
      <button id="tab-login" class="active" type="button">Log in</button>
      <button id="tab-signup" type="button">Sign up</button>
    </div>
    <form id="auth-form">
      <div id="name-row" style="display:none">
        <label for="full_name">Full name</label>
        <input id="full_name" type="text" autocomplete="name">
      </div>
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email">
      <label for="password">Password (at least 6 characters)</label>
      <input id="password" type="password" required minlength="6" autocomplete="current-password">
      <div id="terms-row" style="display:none;margin-top:12px;font-size:14px">
        <label style="display:flex;gap:8px;align-items:flex-start;margin:0">
          <input id="agree" type="checkbox" style="width:auto;margin-top:3px">
          <span>I am 18 or older and I agree to the <a href="#" class="tl">Rules &amp; Terms</a>.</span>
        </label>
      </div>
      <button id="submit" type="submit">Log in</button>
      <div id="msg"></div>
    </form>
  </section>

  <!-- Logged-in area -->
  <section id="app" style="display:none">
    <div class="card">
      <div class="muted">Signed in as <span id="who"></span></div>
      <div class="muted" style="margin-top:16px">Wallet balance</div>
      <div class="balance" id="balance">0.00</div>
    </div>
    <div class="card">
      <h2 style="margin-top:0;font-family:Georgia,serif">Add funds</h2>
      <div id="payinfo" class="muted" style="margin-bottom:8px"></div>
      <label for="dep_amount">Amount (USD)</label>
      <input id="dep_amount" type="number" min="1" step="0.01">
      <label for="dep_method">Method</label>
      <select id="dep_method">
        <option value="bank_transfer">Bank transfer</option>
        <option value="crypto">Crypto</option>
      </select>
      <label for="dep_ref">Your payment reference</label>
      <input id="dep_ref" type="text" maxlength="100">
      <button id="dep_btn" class="buy" type="button" style="margin-top:12px">Submit deposit request</button>
      <div id="depmsg" style="margin-top:12px;font-size:14px;"></div>
      <h3 style="margin:20px 0 4px;font-family:Georgia,serif">My deposits</h3>
      <div id="deposits" class="muted">Loading...</div>
    </div>
    <div class="card">
      <h2 style="margin-top:0;font-family:Georgia,serif">Draws</h2>
      <div id="draws" class="muted">Loading...</div>
      <div id="buymsg" style="margin-top:12px;font-size:14px;"></div>
    </div>
    <div class="card">
      <h2 style="margin-top:0;font-family:Georgia,serif">My tickets</h2>
      <div id="tickets" class="muted">Loading...</div>
    </div>

    <!-- Admin area: only visible to admin accounts -->
    <div id="admin" class="card" style="display:none;border-color:#c0362c">
      <h2 style="margin-top:0;font-family:Georgia,serif">Admin</h2>
      <div id="adm_msg" style="margin-bottom:12px;font-size:14px;"></div>

      <h3 style="margin:8px 0 4px;font-family:Georgia,serif">Create a draw</h3>
      <label for="adm_title">Title</label>
      <input id="adm_title" type="text" maxlength="100">
      <label for="adm_type">Prize type</label>
      <select id="adm_type">
        <option value="rv">RV</option>
        <option value="camping_van">Camping van</option>
        <option value="camping_truck">Camping truck</option>
      </select>
      <label for="adm_price">Ticket price (USD)</label>
      <input id="adm_price" type="number" min="1" step="0.01">
      <label for="adm_max">Maximum tickets</label>
      <input id="adm_max" type="number" min="1" step="1">
      <button id="adm_create" class="buy" type="button" style="margin-top:12px">Create draw</button>

      <h3 style="margin:24px 0 4px;font-family:Georgia,serif">Pending deposits</h3>
      <div id="adm_deposits" class="muted">Loading...</div>

      <h3 style="margin:24px 0 4px;font-family:Georgia,serif">Draws</h3>
      <div id="adm_draws" class="muted">Loading...</div>
    </div>
  </section>
</main>

<footer style="text-align:center;padding:8px 16px 32px;font-size:14px">
  <a href="#" id="terms-link">Rules &amp; Terms</a>
</footer>

<div id="terms-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;overflow:auto;padding:16px">
  <div class="card" style="max-width:640px;margin:24px auto">
    <h2 style="margin-top:0;font-family:Georgia,serif">Rules &amp; Terms</h2>
    <div id="terms-body" class="terms"></div>
    <button id="terms-close" class="buy" type="button" style="margin-top:20px">Close</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://bhmlskishqkldhdknyxp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_RQCf4jqqHqgNT3lZrdYYrA_T1SLMCK8';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = (id) => document.getElementById(id);
  let mode = 'login';

  function setMode(m) {
    mode = m;
    $('tab-login').classList.toggle('active', m === 'login');
    $('tab-signup').classList.toggle('active', m === 'signup');
    $('name-row').style.display = m === 'signup' ? 'block' : 'none';
    $('terms-row').style.display = m === 'signup' ? 'block' : 'none';
    $('submit').textContent = m === 'signup' ? 'Create account' : 'Log in';
    $('password').autocomplete = m === 'signup' ? 'new-password' : 'current-password';
    msg('');
  }
  function msg(text, ok) {
    const el = $('msg');
    el.textContent = text;
    el.className = ok ? 'ok' : 'err';
  }

  $('tab-login').onclick = () => setMode('login');
  $('tab-signup').onclick = () => setMode('signup');

  $('auth-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const email = $('email').value.trim();
    const password = $('password').value;
    if (mode === 'signup' && !$('agree').checked) {
      msg('Please confirm that you are 18 or older and agree to the Rules & Terms.');
      return;
    }
    $('submit').disabled = true;
    msg('');
    try {
      if (mode === 'signup') {
        const { data, error } = await sb.auth.signUp({
          email, password,
          options: { data: { full_name: $('full_name').value.trim(), terms_accepted_at: new Date().toISOString() } }
        });
        if (error) throw error;
        if (!data.session) msg('Account created. Check your email to confirm, then log in.', true);
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (e) {
      msg(e.message || 'Something went wrong.');
    }
    $('submit').disabled = false;
  });

  $('logout').onclick = () => sb.auth.signOut();

  // Shown to players under "Add funds". Replace only after the organiser's licence and payment details are confirmed.
  const PAYMENT_INSTRUCTIONS = 'Payment instructions are not available yet. Deposits are currently in test mode.';

  const PRIZE = { rv: 'RV', camping_van: 'Camping van', camping_truck: 'Camping truck' };

  async function show(session) {
    $('auth').style.display = session ? 'none' : 'block';
    $('app').style.display = session ? 'block' : 'none';
    $('logout').style.display = session ? 'inline-block' : 'none';
    if (!session) return;
    $('who').textContent = session.user.email;
    loadTickets();
    loadDeposits();
    loadAdmin();
    $('payinfo').textContent = PAYMENT_INSTRUCTIONS;

    const w = await sb.from('wallets').select('balance_cents,currency').maybeSingle();
    if (w.data) {
      $('balance').textContent = (w.data.balance_cents / 100).toFixed(2) + ' ' + w.data.currency;
    }

    const d = await sb.from('draws').select('*, draw_images(id, path, created_at)').order('created_at', { ascending: false });
    const box = $('draws');
    box.textContent = '';
    if (d.error || !d.data || d.data.length === 0) {
      box.textContent = 'No open draws yet.';
      return;
    }
    d.data.forEach((x) => {
      const row = document.createElement('div');
      row.className = 'draw';
      const t = document.createElement('strong');
      t.textContent = x.title;
      const s = document.createElement('div');
      s.className = 'muted';
      s.textContent = (PRIZE[x.prize_type] || x.prize_type) + ' | ticket ' +
        (x.ticket_price_cents / 100).toFixed(2) + ' | max ' + x.max_tickets + ' tickets';
      row.appendChild(t);
      row.appendChild(s);
      row.appendChild(buildGallery(x.draw_images));
      if (x.status === 'open') {
        const b = document.createElement('button');
        b.className = 'buy';
        b.textContent = 'Buy ticket (' + (x.ticket_price_cents / 100).toFixed(2) + ')';
        b.onclick = () => buy(x.id, b);
        row.appendChild(b);
      } else {
        const st = document.createElement('div');
        st.style.marginTop = '8px';
        st.className = x.status === 'drawn' ? 'ok' : 'muted';
        st.textContent = x.status === 'drawn'
          ? 'Draw finished. Winning ticket: #' + x.winner_ticket_number
          : 'Ticket sales closed';
        row.appendChild(st);
      }
      box.appendChild(row);
    });
  }

  async function buy(drawId, btn) {
    const out = $('buymsg');
    btn.disabled = true;
    out.className = 'muted';
    out.textContent = 'Processing...';
    const { data, error } = await sb.rpc('buy_ticket', { p_draw_id: drawId });
    if (error) {
      out.className = 'err';
      out.textContent = error.message;
    } else {
      out.className = 'ok';
      out.textContent = 'Success! Your ticket number is ' + data + '.';
    }
    btn.disabled = false;
    const cur = await sb.auth.getSession();
    if (cur.data.session) show(cur.data.session);
  }

  async function loadTickets() {
    const box = $('tickets');
    const t = await sb.from('tickets').select('id, ticket_number, draws(title, winner_ticket_id)').order('created_at', { ascending: false });
    box.textContent = '';
    if (t.error || !t.data || t.data.length === 0) {
      box.textContent = 'You have no tickets yet.';
      return;
    }
    t.data.forEach((x) => {
      const r = document.createElement('div');
      r.className = 'draw';
      const won = x.draws && x.draws.winner_ticket_id === x.id;
      r.textContent = (x.draws ? x.draws.title : 'Draw') + ' - ticket #' + x.ticket_number + (won ? '  - WINNER!' : '');
      if (won) { r.style.fontWeight = 'bold'; r.style.color = '#1b7a3d'; }
      box.appendChild(r);
    });
  }

  $('dep_btn').onclick = async () => {
    const out = $('depmsg');
    const amount = Math.round(parseFloat($('dep_amount').value) * 100);
    if (!amount || amount < 100) {
      out.className = 'err';
      out.textContent = 'Enter an amount of at least 1.00';
      return;
    }
    $('dep_btn').disabled = true;
    out.className = 'muted';
    out.textContent = 'Sending...';
    const { error } = await sb.rpc('request_deposit', {
      p_amount_cents: amount,
      p_method: $('dep_method').value,
      p_reference: $('dep_ref').value
    });
    if (error) {
      out.className = 'err';
      out.textContent = error.message;
    } else {
      out.className = 'ok';
      out.textContent = 'Request received. It will be credited after it is approved.';
      $('dep_amount').value = '';
      $('dep_ref').value = '';
      loadDeposits();
    }
    $('dep_btn').disabled = false;
  };

  async function loadDeposits() {
    const box = $('deposits');
    const t = await sb.from('transactions')
      .select('amount_cents, method, status, created_at')
      .eq('type', 'deposit')
      .order('created_at', { ascending: false })
      .limit(10);
    box.textContent = '';
    if (t.error || !t.data || t.data.length === 0) {
      box.textContent = 'No deposits yet.';
      return;
    }
    t.data.forEach((x) => {
      const r = document.createElement('div');
      r.className = 'draw';
      r.textContent = (x.amount_cents / 100).toFixed(2) + ' - ' + x.method.replace('_', ' ') + ' - ' + x.status;
      box.appendChild(r);
    });
  }

  // ---------- Admin ----------
  function admMsg(text, ok) {
    const el = $('adm_msg');
    el.className = ok ? 'ok' : 'err';
    el.textContent = text;
  }
  async function refreshAll() {
    const cur = await sb.auth.getSession();
    if (cur.data.session) show(cur.data.session);
  }

  async function loadAdmin() {
    const p = await sb.from('profiles').select('is_admin').maybeSingle();
    const isAdmin = !!(p.data && p.data.is_admin);
    $('admin').style.display = isAdmin ? 'block' : 'none';
    if (!isAdmin) return;

    const dbox = $('adm_deposits');
    const dep = await sb.rpc('admin_pending_deposits');
    dbox.textContent = '';
    if (dep.error) {
      dbox.textContent = dep.error.message;
    } else if (!dep.data || dep.data.length === 0) {
      dbox.textContent = 'No pending deposits.';
    } else {
      dep.data.forEach((x) => {
        const row = document.createElement('div');
        row.className = 'draw';
        const amt = (x.amount_cents / 100).toFixed(2);
        const info = document.createElement('div');
        info.textContent = amt + ' - ' + x.method.replace('_', ' ') + ' - ref: ' + x.reference + ' - ' + x.email;
        const ok = document.createElement('button');
        ok.className = 'buy';
        ok.textContent = 'Approve';
        ok.onclick = async () => {
          if (!confirm('Approve ' + amt + ' for ' + x.email + '?\nOnly approve if the money has really arrived.')) return;
          const r = await sb.rpc('admin_approve_deposit', { p_tx_id: x.id });
          if (r.error) admMsg(r.error.message); else admMsg(r.data, true);
          refreshAll();
        };
        const no = document.createElement('button');
        no.className = 'buy rej';
        no.textContent = 'Reject';
        no.onclick = async () => {
          if (!confirm('Reject this deposit of ' + amt + ' from ' + x.email + '?')) return;
          const r = await sb.rpc('admin_reject_deposit', { p_tx_id: x.id });
          if (r.error) admMsg(r.error.message); else admMsg(r.data, true);
          refreshAll();
        };
        row.appendChild(info);
        row.appendChild(ok);
        row.appendChild(no);
        dbox.appendChild(row);
      });
    }

    const wbox = $('adm_draws');
    const dr = await sb.rpc('admin_draws');
    const imgs = await sb.from('draw_images').select('id, draw_id, path, created_at').order('created_at');
    const byDraw = {};
    ((imgs.data) || []).forEach((i) => { (byDraw[i.draw_id] = byDraw[i.draw_id] || []).push(i); });
    wbox.textContent = '';
    if (dr.error) {
      wbox.textContent = dr.error.message;
    } else if (!dr.data || dr.data.length === 0) {
      wbox.textContent = 'No draws yet.';
    } else {
      dr.data.forEach((x) => {
        const row = document.createElement('div');
        row.className = 'draw';
        const info = document.createElement('div');
        info.textContent = x.title + ' - ' + x.status + ' - ' + x.tickets + ' / ' + x.max_tickets + ' tickets sold';
        row.appendChild(info);

        const thumbs = document.createElement('div');
        (byDraw[x.id] || []).forEach((im) => {
          const box = document.createElement('span');
          box.style.cssText = 'display:inline-block;position:relative;margin:6px 8px 0 0';
          const t = document.createElement('img');
          t.src = imgUrl(im.path);
          t.className = 'gal-thumb';
          t.alt = 'Prize photo';
          const rm = document.createElement('button');
          rm.type = 'button';
          rm.textContent = 'x';
          rm.title = 'Remove this photo';
          rm.style.cssText = 'position:absolute;top:-6px;right:-6px;border:0;border-radius:50%;width:20px;height:20px;background:#c0362c;color:#fff;cursor:pointer;line-height:1';
          rm.onclick = async () => {
            if (!confirm('Remove this photo?')) return;
            await sb.storage.from('draw-images').remove([im.path]);
            await sb.from('draw_images').delete().eq('id', im.id);
            refreshAll();
          };
          box.appendChild(t);
          box.appendChild(rm);
          thumbs.appendChild(box);
        });
        row.appendChild(thumbs);

        const fi = document.createElement('input');
        fi.type = 'file';
        fi.accept = 'image/jpeg,image/png,image/webp';
        fi.multiple = true;
        fi.style.marginTop = '8px';
        const upb = document.createElement('button');
        upb.className = 'buy';
        upb.type = 'button';
        upb.textContent = 'Upload photos';
        upb.onclick = () => uploadImages(x.id, fi.files, upb);
        row.appendChild(fi);
        row.appendChild(upb);

        if (x.status === 'open' && Number(x.tickets) > 0) {
          const b = document.createElement('button');
          b.className = 'buy';
          b.textContent = 'Pick winner';
          b.onclick = async () => {
            if (!confirm('Pick the winner for "' + x.title + '"?\nThis closes the draw and cannot be undone.')) return;
            const r = await sb.rpc('admin_pick_winner', { p_draw_id: x.id });
            if (r.error) admMsg(r.error.message); else admMsg(r.data, true);
            refreshAll();
          };
          row.appendChild(b);
        }
        wbox.appendChild(row);
      });
    }
  }

  $('adm_create').onclick = async () => {
    const price = Math.round(parseFloat($('adm_price').value) * 100);
    const max = parseInt($('adm_max').value, 10);
    if (!price || price < 1 || !max || max < 1) {
      admMsg('Enter a valid ticket price and maximum tickets.');
      return;
    }
    const r = await sb.rpc('admin_create_draw', {
      p_title: $('adm_title').value,
      p_prize_type: $('adm_type').value,
      p_price_cents: price,
      p_max_tickets: max
    });
    if (r.error) {
      admMsg(r.error.message);
    } else {
      admMsg('Draw created.', true);
      $('adm_title').value = '';
      $('adm_price').value = '';
      $('adm_max').value = '';
      refreshAll();
    }
  };

  // ---------- Photos ----------
  function imgUrl(path) {
    return sb.storage.from('draw-images').getPublicUrl(path).data.publicUrl;
  }

  function buildGallery(images) {
    const wrap = document.createElement('div');
    if (!images || images.length === 0) return wrap;
    const list = images.slice().sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    const main = document.createElement('img');
    main.className = 'gal-main';
    main.alt = 'Prize photo';
    main.src = imgUrl(list[0].path);
    wrap.appendChild(main);
    if (list.length > 1) {
      const strip = document.createElement('div');
      strip.className = 'gal-row';
      list.forEach((im) => {
        const t = document.createElement('img');
        t.className = 'gal-thumb';
        t.alt = 'Prize photo thumbnail';
        t.src = imgUrl(im.path);
        t.onclick = () => { main.src = t.src; };
        strip.appendChild(t);
      });
      wrap.appendChild(strip);
    }
    return wrap;
  }

  async function uploadImages(drawId, files, btn) {
    if (!files || files.length === 0) {
      admMsg('Choose one or more photos first.');
      return;
    }
    btn.disabled = true;
    admMsg('Uploading...', true);
    let done = 0;
    for (const f of files) {
      if (f.size > 5 * 1024 * 1024) {
        admMsg('"' + f.name + '" is larger than 5 MB. Make it smaller and try again.');
        continue;
      }
      const ext = (f.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
      const path = drawId + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
      const up = await sb.storage.from('draw-images').upload(path, f, { contentType: f.type });
      if (up.error) { admMsg(up.error.message); continue; }
      const ins = await sb.from('draw_images').insert({ draw_id: drawId, path: path });
      if (ins.error) { admMsg(ins.error.message); continue; }
      done++;
    }
    btn.disabled = false;
    if (done > 0) admMsg(done + ' photo(s) uploaded.', true);
    refreshAll();
  }

  // ---------- Rules & Terms ----------
  // The organiser fills these in when the details are confirmed. Empty fields are not shown.
  const ORGANISER = {
    name: '',      // legal name of the organisation running the draws
    licence: '',   // draw / raffle licence or permit number and issuing authority
    charity: '',   // registered charity name and number
    email: ''      // contact email for players
  };

  function termsSections() {
    const org = [];
    if (ORGANISER.name) org.push('Organiser: ' + ORGANISER.name + '.');
    if (ORGANISER.charity) org.push('Charity: ' + ORGANISER.charity + '.');
    if (ORGANISER.licence) org.push('Licence: ' + ORGANISER.licence + '.');
    if (ORGANISER.email) org.push('Contact: ' + ORGANISER.email + '.');
    return [
      ['Who runs these draws',
        org.length ? org.join(' ') : 'The organiser details will be published here before the draws go live.'],
      ['Who can take part',
        'You must be 18 or older. You are responsible for making sure that taking part in a prize draw is allowed where you live.'],
      ['Your wallet and deposits',
        'You ask to add money to your wallet by submitting a deposit request. Money is added only after the organiser confirms that your payment has arrived. A request that is not confirmed is not credited.'],
      ['Tickets',
        'Each ticket costs the price shown on the draw. When you buy a ticket the price is taken from your wallet straight away and you receive a ticket number. Tickets cannot be exchanged. If a draw is cancelled, the ticket price is returned to your wallet.'],
      ['How the winner is chosen',
        'When a draw is closed, one ticket is chosen at random by the platform using a secure random generator. The winning ticket number is shown on the site. Ticket numbers do not show who owns them.'],
      ['Prizes',
        'The prize is the one described in the draw title. The winner is told by email, using the email address on the winning account.'],
      ['Questions or problems',
        ORGANISER.email ? 'Write to ' + ORGANISER.email + '.' : 'Contact details will be published here before the draws go live.'],
      ['Changes to these terms',
        'These terms may be updated. The version shown on this page is the one that applies.']
    ];
  }

  function openTerms() {
    const body = $('terms-body');
    body.textContent = '';
    termsSections().forEach((sec) => {
      const h = document.createElement('h3');
      h.textContent = sec[0];
      const p = document.createElement('p');
      p.textContent = sec[1];
      body.appendChild(h);
      body.appendChild(p);
    });
    $('terms-modal').style.display = 'block';
  }
  document.querySelectorAll('.tl, #terms-link').forEach((a) => {
    a.onclick = (e) => { e.preventDefault(); openTerms(); };
  });
  $('terms-close').onclick = () => { $('terms-modal').style.display = 'none'; };

  // Fires on page load and on every login/logout
  sb.auth.onAuthStateChange((_event, session) => {
    setTimeout(() => show(session), 0);
  });
</script>
</body>
</html>
